name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('lambda/requirements-dev.txt') }}
          restore-keys: pip-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('infra-cdk/package-lock.json') }}
          restore-keys: npm-

      - name: Cache Smithy Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/software/amazon/smithy
          key: smithy-${{ hashFiles('smithy-model/smithy-build.json') }}
          restore-keys: smithy-

      - name: Install Smithy CLI and pre-populate Maven cache
        run: |
          curl -sL https://github.com/awslabs/smithy/releases/download/1.50.0/smithy-cli-linux-x86_64.zip \
            -o /tmp/smithy-cli.zip
          unzip -q /tmp/smithy-cli.zip -d /tmp/smithy-cli
          echo "/tmp/smithy-cli/smithy-cli-linux-x86_64/bin" >> "$GITHUB_PATH"
          SMITHY_VER=1.50.0
          BASE="https://repo1.maven.org/maven2/software/amazon/smithy"
          M2="$HOME/.m2/repository/software/amazon/smithy"
          for artifact in \
            smithy-model smithy-utils smithy-aws-traits \
            smithy-aws-apigateway-openapi smithy-openapi smithy-validation-model \
            smithy-diff smithy-build smithy-jsonschema smithy-openapi-traits \
            smithy-aws-apigateway-traits smithy-cli smithy-syntax smithy-jmespath; do
            dest="$M2/$artifact/$SMITHY_VER"
            if [ ! -f "$dest/$artifact-$SMITHY_VER.jar" ]; then
              mkdir -p "$dest"
              for ext in jar pom; do
                curl -fsSL "$BASE/$artifact/$SMITHY_VER/$artifact-$SMITHY_VER.$ext" \
                  -o "$dest/$artifact-$SMITHY_VER.$ext"
              done
            fi
          done

      - name: Install Python dev dependencies
        run: pip install -r lambda/requirements-dev.txt

      - name: ruff
        run: ruff check lambda/ tests/

      - name: mypy
        run: mypy lambda/ tests/ --strict

      - name: pytest + coverage
        run: pytest tests/ -v --cov=lambda --cov-fail-under=90 --cov-report=xml

      - name: smithy validate
        run: smithy validate --config smithy-model/smithy-build.json smithy-model/model/

      - name: CDK npm ci + test
        run: cd infra-cdk && npm ci && npm test

      - name: build.sh smoke
        run: ./scripts/build.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
