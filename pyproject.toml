[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda"]

[tool.coverage.run]
source = ["lambda"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "lambda"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
